<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | CampusConnect</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #475569;
        }

        input,
        select,
        textarea {
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6366f1;
        }

        select {
            cursor: pointer;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #475569;
        }

        .back:hover {
            color: #4f46e5;
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: #64748b;
        }

        .flash {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>✏️ Edit Student Profile</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('edit_profile') }}" enctype="multipart/form-data">
            <div class="grid">

                <div class="field">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        value="{{ student['phone'] or '' if student else '' }}"
                        placeholder="Enter phone number"
                        maxlength="10"
                    >
                </div>

                <div class="field">
                    <label for="course">Course</label>
                    <input
                        type="text"
                        id="course"
                        name="course"
                        value="{{ student['course'] or '' if student else '' }}"
                        placeholder="Enter your course"
                    >
                </div>

                <div class="field full">
                    <label for="college">College</label>
                    <input
                        type="text"
                        id="college"
                        name="college"
                        value="{{ student['college'] or '' if student else '' }}"
                        placeholder="Enter your college name"
                    >
                </div>

                <div class="field">
                    <label for="graduation_year">Graduation Year</label>
                    <select
                        id="graduation_year"
                        name="graduation_year"
                        required
                    >
                        <option value="">Select Graduation Year</option>

                        {% for year in range(current_year, 1899, -1) %}
                            <option
                                value="{{ year }}"
                                {% if student and student['graduation_year'] and student['graduation_year']|string == year|string %}
                                    selected
                                {% endif %}
                            >
                                {{ year }}
                            </option>
                        {% endfor %}
                    </select>

                    <div class="hint">Select your graduation year</div>
                </div>

                <div class="field">
                    <label for="cgpa">CGPA</label>
                    <input
                        type="number"
                        id="cgpa"
                        name="cgpa"
                        value="{{ student['cgpa'] if student and student['cgpa'] is not none else '' }}"
                        placeholder="Enter your CGPA"
                        step="0.01"
                        min="0"
                        max="10"
                    >
                    <div class="hint">Enter a value from 0 to 10</div>
                </div>
                <div class="field full">
    <label for="resume">Resume (PDF, maximum 5 MB)</label>

    <input
        type="file"
        id="resume"
        name="resume"
        accept=".pdf,application/pdf"
    >

    <div class="hint">
        PDF resume select karo.
    </div>
</div>

                <div class="field full">
                    <label for="skills">Skills</label>
                    <textarea
                        id="skills"
                        name="skills"
                        placeholder="Example: Python, Java, MySQL, HTML, CSS"
                    >{{ student['skills'] or '' if student else '' }}</textarea>
                </div>

                <div class="field full">
                    <label for="bio">About You</label>
                    <textarea
                        id="bio"
                        name="bio"
                        placeholder="Write something about yourself..."
                    >{{ student['bio'] or '' if student else '' }}</textarea>
                </div>

            </div>

            <button type="submit">💾 Save Profile</button>
        </form>

        <a href="{{ url_for('profile') }}" class="back">
            ← Back to Profile
        </a>

    </div>
</div>

</body>
</html>
