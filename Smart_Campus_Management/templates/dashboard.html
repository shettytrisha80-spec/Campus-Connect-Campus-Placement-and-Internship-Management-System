<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard | CampusConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .student-shortcuts {
            padding: 10px 4%;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .shortcut-inner {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .student-shortcuts a {
            display: inline-block;
            padding: 9px 14px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            background: #ffffff;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .student-shortcuts a:hover {
            border-color: #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .dashboard-card {
            min-height: 190px;
            border-radius: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(15, 23, 42, 0.14);
        }

        .profile-link {
            color: inherit;
            text-decoration: none;
        }

        @media (max-width: 576px) {
            .navbar {
                padding-left: 16px !important;
                padding-right: 16px !important;
            }

            .dashboard-welcome {
                padding: 25px !important;
            }

            .dashboard-welcome h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-5">
        <span class="navbar-brand mb-0">
            🎓 CampusConnect
        </span>

        <a href="/logout" class="btn btn-danger">
            Logout
        </a>
    </nav>

    <nav class="student-shortcuts">
        <div class="container-fluid shortcut-inner">
            <a href="{{ url_for('job_search') }}">
                💼 Find Jobs &amp; Internships
            </a>

            <a href="{{ url_for('student_notifications') }}">
                🔔 Notifications
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <section class="dashboard-welcome bg-white p-5 rounded-4 shadow-sm">
            <h1>
                Welcome, {{ name }} 👋
            </h1>

            <p class="text-muted">
                Student Dashboard
            </p>

            <hr>

            <div class="row g-4 mt-3">

                <div class="col-md-4">
                    <a href="{{ url_for('profile') }}" class="profile-link">
                        <div class="dashboard-card p-4 bg-primary text-white">
                            <h4>🎓 Profile</h4>

                            <p>
                                Manage your student profile.
                            </p>

                            <span class="btn btn-light mt-2">
                                View Profile →
                            </span>
                        </div>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="{{ url_for('job_search') }}" class="profile-link">
                        <div class="dashboard-card p-4 bg-success text-white">
                            <h4>💼 Jobs</h4>

                            <p>
                                Explore placement opportunities.
                            </p>

                            <span class="btn btn-light mt-2">
                                Find Jobs →
                            </span>
                        </div>
                    </a>
                </div>

                <div class="col-md-4">
                    <div class="dashboard-card p-4 bg-warning">
                        <h4>📄 Applications</h4>

                        <p>
                            Track your applications.
                        </p>

                        <a
                            href="{{ url_for('my_applications') }}"
                            class="btn btn-dark mt-3"
                        >
                            View My Applications →
                        </a>
                    </div>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
