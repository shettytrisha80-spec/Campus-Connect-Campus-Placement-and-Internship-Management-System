<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #111827,
                #2563eb
            );

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .card-box {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 25px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 50px;
        }

        h2 {
            text-align: center;
            font-weight: 800;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 13px;
            border-radius: 12px;
        }

        .btn-register {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 17px;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .danger-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

    </style>

</head>

<body>


<div class="card-box">

    <div class="logo">
        🎓
    </div>

    <h2>
        Student Registration
    </h2>

    <p class="subtitle">
        Create your CampusConnect account
    </p>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="{{ 'success-message' if category == 'success' else 'danger-message' }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST"
          action="/student_register">


        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Enter your full name"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required>

        </div>


        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Create password"
                required>

        </div>
        <div>
    <label>Confirm Password</label>

    <input
        type="password"
        name="confirm_password"
        placeholder="Confirm your password"
        required
    >

</div>


        <button
            type="submit"
            class="btn btn-primary btn-register">

            Create Student Account

        </button>

    </form>


    <hr class="my-4">


    <div class="text-center">

        Already have an account?

        <a href="/login">
            Login here
        </a>

    </div>

</div>


</body>

</html>
