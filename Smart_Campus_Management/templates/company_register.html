<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Registration | CampusConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #e0f7fa);
            font-family: Arial, sans-serif;
        }

        .register-card {
            max-width: 700px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .company-icon {
            font-size: 65px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-register {
            border-radius: 12px;
            padding: 12px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="register-card">

        <div class="text-center mb-4">

            <div class="company-icon">
                🏢
            </div>

            <h2 class="fw-bold">
                Register Your Company
            </h2>

            <p class="text-muted">
                Campus Placement & Internship Management System
            </p>

        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <div class="mb-3">

                <label class="form-label fw-bold">
                    Company Name
                </label>

                <input
                    type="text"
                    name="company_name"
                    class="form-control"
                    placeholder="Enter company name"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label fw-bold">
                    HR Name
                </label>

                <input
                    type="text"
                    name="hr_name"
                    class="form-control"
                    placeholder="Enter HR name"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label fw-bold">
                    HR Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="hr@company.com"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label fw-bold">
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    placeholder="Enter phone number"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label fw-bold">
                    Company Website
                </label>

                <input
                    type="text"
                    name="website"
                    class="form-control"
                    placeholder="www.company.com">

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-register w-100">

                🏢 Register Company

            </button>

        </form>


        <div class="text-center mt-4">

            <a href="/recruiter_dashboard"
               class="text-decoration-none">

                ← Back to Recruiter Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
