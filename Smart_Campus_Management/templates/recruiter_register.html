<!DOCTYPE html>
<html>

<head>

    <title>Recruiter Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body
    class="d-flex align-items-center justify-content-center"
    style="
        min-height:100vh;
        background:linear-gradient(135deg,#111827,#2563eb);
    ">


<div class="bg-white p-5 rounded-4 shadow-lg"
     style="width:450px;">

    <div class="text-center">

        <div style="font-size:50px;">
            🏢
        </div>

        <h2 class="fw-bold">
            Recruiter Registration
        </h2>

        <p class="text-muted">
            Create your recruiter account
        </p>

    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">


        <!-- COMPANY NAME -->

        <div class="mb-3">

            <label class="form-label">
                Company Name
            </label>

            <input
                type="text"
                name="company_name"
                class="form-control"
                placeholder="Enter company name"
                required>

        </div>


        <!-- HR NAME -->

        <div class="mb-3">

            <label class="form-label">
                HR Name
            </label>

            <input
                type="text"
                name="hr_name"
                class="form-control"
                placeholder="Enter HR name"
                required>

        </div>


        <!-- EMAIL -->

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter email address"
                required>

        </div>


        <!-- PHONE -->

        <div class="mb-3">

            <label class="form-label">
                Phone Number
            </label>

            <input
                type="tel"
                name="phone"
                class="form-control"
                placeholder="Enter 10-digit phone number"
                maxlength="10"
                required>

        </div>


        <!-- WEBSITE -->

        <div class="mb-3">

            <label class="form-label">
                Company Website
            </label>

            <input
                type="text"
                name="website"
                class="form-control"
                placeholder="https://example.com">

        </div>


        <!-- PASSWORD -->

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Create password"
                required>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="mb-4">

            <label class="form-label">
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm your password"
                required>

        </div>


        <!-- REGISTER BUTTON -->

        <button
            type="submit"
            class="btn btn-primary w-100 py-2 fw-bold">

            Create Recruiter Account

        </button>

    </form>


    <div class="text-center mt-4">

        Already registered?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>

</html>
