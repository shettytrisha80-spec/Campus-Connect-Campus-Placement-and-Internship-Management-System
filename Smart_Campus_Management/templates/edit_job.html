<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job | CampusConnect</title>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }

        body {
            margin: 0;
            padding: 35px 18px;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container { max-width: 760px; margin: auto; }

        .card {
            padding: 28px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px #0f172a12;
        }

        h1 { margin-top: 0; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field { display: flex; flex-direction: column; }
        .full { grid-column: 1 / -1; }

        label {
            margin-bottom: 7px;
            color: #475569;
            font-weight: bold;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        textarea { min-height: 120px; resize: vertical; }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: #4f46e5;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: auto; }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card">
        <h1>Edit Job / Internship</h1>

        <form method="POST" action="{{ url_for('job_edit', job_id=job['job_id']) }}">
            <div class="grid">

                <div class="field">
                    <label for="company_name">Company Name</label>
                    <input
                        type="text"
                        id="company_name"
                        name="company_name"
                        value="{{ job['company_name'] or '' }}"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="field">
                    <label for="job_type">Type</label>
                    <select id="job_type" name="job_type" required>
                        <option value="Job" {% if job['job_type'] == 'Job' %}selected{% endif %}>Job</option>
                        <option value="Internship" {% if job['job_type'] == 'Internship' %}selected{% endif %}>Internship</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="job_title">Title</label>
                    <input
                        type="text"
                        id="job_title"
                        name="job_title"
                        value="{{ job['job_title'] or '' }}"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="field">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        value="{{ job['location'] or '' }}"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="field">
                    <label for="salary">Salary / Stipend</label>
                    <input
                        type="text"
                        id="salary"
                        name="salary"
                        value="{{ job['salary'] or '' }}"
                        maxlength="50"
                    >
                </div>

                <div class="field">
                    <label for="eligibility">Eligibility</label>
                    <input
                        type="text"
                        id="eligibility"
                        name="eligibility"
                        value="{{ job['eligibility'] or '' }}"
                        maxlength="50"
                    >
                </div>

                <div class="field">
                    <label for="application_deadline">Application Deadline</label>
                    <input
                        type="date"
                        id="application_deadline"
                        name="application_deadline"
                        value="{{ job['application_deadline'] or '' }}"
                    >
                </div>

                <div class="field full">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        required
                    >{{ job['description'] or '' }}</textarea>
                </div>

            </div>

            <button type="submit">Save Changes</button>
        </form>

        <a class="back" href="{{ url_for('manage_jobs') }}">
            ← Back to My Listings
        </a>
    </div>
</div>
</body>
</html>
