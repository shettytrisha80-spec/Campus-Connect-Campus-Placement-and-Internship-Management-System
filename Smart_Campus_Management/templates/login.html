<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #111827, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 25px;
            background: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 50px;
        }

        h2 {
            text-align: center;
            font-weight: 800;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #6b7280;
            text-align: center;
        }

        .form-control {
            padding: 13px;
            border-radius: 12px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
        }

        .success-message,
        .danger-message {
            margin-bottom: 20px;
            padding: 13px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
        }

        .danger-message {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">🎓</div>

        <h2>Welcome Back</h2>

        <p class="subtitle">Login to CampusConnect</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'success-message' if category == 'success' else 'danger-message' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary login-btn">
                Login
            </button>
        </form>

        <hr class="my-4">

        <div class="text-center">
            Don't have an account?
            <br><br>

            <a href="/student_register">Register as Student</a>
            <br>
            <a href="/recruiter_register">Register as Recruiter</a>
        </div>
    </div>

</body>
</html>
