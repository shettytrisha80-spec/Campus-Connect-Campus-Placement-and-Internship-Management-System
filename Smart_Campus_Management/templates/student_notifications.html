<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | CampusConnect</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px 18px;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .notice, .empty {
            background: white;
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .unread {
            border-left: 5px solid #4f46e5;
            background: #eef2ff;
        }

        .date {
            margin-top: 8px;
            color: #64748b;
            font-size: 13px;
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Notifications</h1>

    <a class="back" href="{{ url_for('dashboard') }}">
        ← Back to Dashboard
    </a>

    {% if notifications %}
        {% for notification in notifications %}
            <div class="notice {% if not notification['is_read'] %}unread{% endif %}">
                <p>{{ notification['message'] }}</p>
                <div class="date">{{ notification['created_at'] }}</div>
                {% if not notification['is_read'] %}
    <form
        method="POST"
        action="{{ url_for(
            'mark_notification_read',
            notification_id=notification['notification_id']
        ) }}"
    >
        <button
            type="submit"
            style="margin-top:10px; padding:8px 12px; border:0;
                   border-radius:7px; background:#4f46e5; color:white;
                   cursor:pointer;"
        >
            Mark as Read
        </button>
    </form>
{% endif %}
            </div>
        {% endfor %}
    {% else %}
        <div class="empty">
            <p>You have no notifications yet.</p>
        </div>
    {% endif %}

</div>
</body>
</html>
